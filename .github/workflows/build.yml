name: Build VS Code extension

permissions: {}

on:
  workflow_call:
    inputs:
      reqstool_version:
        description: "reqstool version to install (empty = latest)"
        required: false
        default: ""
        type: string
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      version:
        description: "Stamp package.json with this version before packaging. Empty = leave as-is."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the VSIX under. The release flow runs this workflow
          twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
  workflow_dispatch:
    inputs:
      reqstool_version:
        description: "reqstool version to install (empty = latest)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  # `permissions: {}` above grants the jobs nothing, and a called workflow may
  # not request more than its caller was granted -- asking for more is rejected
  # before any job runs, with no check run produced to say so. Every callee
  # declares `contents: read`, so every caller has to grant it.
  lint:
    permissions:
      contents: read
    uses: reqstool/.github/.github/workflows/typescript-lint.yml@193abb8e7ad36805d5fe7695f8fa5e0a4b6f8da7 # 1.3.0

  build:
    needs: lint
    permissions:
      contents: read
    uses: reqstool/.github/.github/workflows/typescript-build.yml@193abb8e7ad36805d5fe7695f8fa5e0a4b6f8da7 # 1.3.0
    with:
      use-xvfb: true
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      artifact-name: ${{ inputs.artifact-name || 'dist' }}
      dependency-version: ${{ inputs.reqstool_version || 'latest' }}
      dependency-install-command: ${{ inputs.reqstool_version != '' && 'pipx install reqstool=={version}' || 'pipx install reqstool' }}

  # The extension host tests need a downloaded VS Code; run them on the other
  # operating systems too (no xvfb needed there).
  smoke:
    needs: build
    permissions:
      contents: read
    uses: reqstool/.github/.github/workflows/typescript-smoke.yml@193abb8e7ad36805d5fe7695f8fa5e0a4b6f8da7 # 1.3.0
    with:
      # The junit reporter hides test names from the log, so print the failing ones.
      command: npm test || { grep -E -B2 -A12 '<failure' test-results.xml; exit 1; }

  # Single stable required check: survives job renames and matrix changes.
  ci:
    if: ${{ always() }}
    needs: [lint, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c 'import json,sys; r={k:v["result"] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(0 if all(v=="success" for v in r.values()) else 1)'
