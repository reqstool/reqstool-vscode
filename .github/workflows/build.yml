name: Build VS Code extension

permissions: {}

on:
  workflow_call:
    inputs:
      reqstool_version:
        description: "reqstool version to install (empty = latest)"
        required: false
        default: ""
        type: string
      ref:
        description: "Branch, tag or SHA to build. Empty = the caller's ref."
        required: false
        type: string
        default: ""
      version:
        description: "Stamp package.json with this version before packaging. Empty = leave as-is."
        required: false
        type: string
        default: ""
      artifact-name:
        description: >
          Name to upload the VSIX under. The release flow runs this workflow
          twice in one run -- once on the branch, once on the tag -- and
          upload-artifact rejects a duplicate name.
        required: false
        type: string
        default: "dist"
  workflow_dispatch:
    inputs:
      reqstool_version:
        description: "reqstool version to install (empty = latest)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  lint:
    uses: reqstool/.github/.github/workflows/typescript-lint.yml@main

  build:
    needs: lint
    uses: reqstool/.github/.github/workflows/typescript-build.yml@main
    with:
      use-xvfb: true
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      artifact-name: ${{ inputs.artifact-name || 'dist' }}
      dependency-version: ${{ inputs.reqstool_version || 'latest' }}
      dependency-install-command: ${{ inputs.reqstool_version != '' && 'pipx install reqstool=={version}' || 'pipx install reqstool' }}
